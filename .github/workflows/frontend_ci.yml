name: Frontend CI
on:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/**"
      - "pnpm-lock.yaml"

env:
  PNPM_STORE_PATH: ~/.local/share/pnpm/store
  PLAYWRIGHT_CACHE_KEY: ${{ runner.os }}-playwright-${{ hashFiles('pnpm-lock.yaml') }}
  PNPM_CACHE_KEY: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}

jobs:
  setup:
    name: Setup
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json

      - name: Restore pnpm store (with fallback)
        id: pnpm-cache
        uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ env.PNPM_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile
        working-directory: frontend

      - name: Save pnpm store (exact key)
        if: steps.pnpm-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ env.PNPM_CACHE_KEY }}

      - name: Cache Playwright browsers
        id: playwright-cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.PLAYWRIGHT_CACHE_KEY }}

      - name: Install Playwright browsers
        if: steps.playwright-cache.outputs.cache-hit != 'true'
        run: pnpm exec playwright install
        working-directory: frontend

  lint:
    name: Lint & Typecheck
    needs: [setup]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ env.PNPM_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm -F frontend run lint
      - run: pnpm -F frontend run check:types

  build:
    name: Build
    needs: [setup]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ env.PNPM_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - run: pnpm -F frontend run build

  tests:
    name: Tests (shard ${{ matrix.shardIndex }}/${{ matrix.shardTotal }})
    needs: [setup]
    permissions:
      contents: read
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shardIndex: [1, 2, 3, 4, 5]
        shardTotal: [5]
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ env.PNPM_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: actions/cache/restore@v4
        with:
          path: ~/.cache/ms-playwright
          key: ${{ env.PLAYWRIGHT_CACHE_KEY }}
      - run: pnpm exec playwright install-deps
        working-directory: frontend
      - name: Run tests
        continue-on-error: true
        run: pnpm -F frontend run test --reporter=blob --coverage.enabled --shard=${{ matrix.shardIndex }}/${{ matrix.shardTotal }}
      - uses: actions/upload-artifact@v4
        with:
          name: blob-report-${{ matrix.shardIndex }}
          path: frontend/.vitest-reports/*
          include-hidden-files: true
          retention-days: 1

  coverage:
    name: Merge Reports
    if: ${{ !cancelled() }}
    needs: [tests]
    permissions:
      pull-requests: write
      statuses: write
      contents: read
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: frontend/package.json
          run_install: false
      - uses: actions/setup-node@v4
        with:
          node-version-file: frontend/package.json
      - uses: actions/cache/restore@v4
        with:
          path: ${{ env.PNPM_STORE_PATH }}
          key: ${{ env.PNPM_CACHE_KEY }}
          restore-keys: |
            ${{ runner.os }}-pnpm-
      - uses: actions/download-artifact@v4
        with:
          path: frontend/.vitest-reports
          pattern: blob-report-*
          merge-multiple: true
      - id: check-reports
        run: |
          if ls frontend/.vitest-reports/*.blob 1>/dev/null 2>&1; then
            echo "has-reports=true" >> "$GITHUB_OUTPUT"
          else
            echo "has-reports=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Merge reports
        if: steps.check-reports.outputs.has-reports == 'true'
        run: pnpm -F frontend run test --merge-reports --reporter=github-actions --reporter=default --coverage.reporter=text --coverage.reporter=json-summary
      - name: Post coverage status
        if: ${{ github.event_name == 'pull_request' && always() && steps.check-reports.outputs.has-reports == 'true' }}
        uses: actions/github-script@v7
        env:
          JSON_PATH: frontend/coverage/coverage-summary.json
          THRESHOLD: "80"
        with:
          script: |
            const fs = require('fs');
            const jp = process.env.JSON_PATH, t = parseFloat(process.env.THRESHOLD);
            if (!fs.existsSync(jp)) { core.info('no coverage file'); return; }
            function p(v) { const n=typeof v==='number'?v:parseFloat(v); return isNaN(n)?0:+n.toFixed(2); }
            const s=JSON.parse(fs.readFileSync(jp,'utf8')), l=p(s.total.lines.pct), ok=l>=t;
            const d=`Lines: ${l}% | Stmts: ${p(s.total.statements.pct)}% | Funcs: ${p(s.total.functions.pct)}% | Branches: ${p(s.total.branches.pct)}% (>=${t}%)`;
            await github.rest.repos.createCommitStatus({
              owner:context.repo.owner, repo:context.repo.repo, sha:context.sha,
              state:ok?'success':'failure', context:'Coverage', description:d,
              target_url:`${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`
            });
            core.info(`Coverage: ${d}`);
